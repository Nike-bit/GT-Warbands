name: Release Foundry Module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate module version
        id: manifest
        shell: bash
        run: |
          version="$(jq -r '.version' module.json)"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version ${tag}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build Foundry package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/gt-warbands
          cp module.json README.md dist/gt-warbands/
          cp -R lang scripts styles templates dist/gt-warbands/
          if [[ -f LICENSE ]]; then
            cp LICENSE dist/gt-warbands/
          fi
          cp module.json dist/module.json
          cd dist
          zip -r gt-warbands.zip gt-warbands

      - name: Validate release URLs
        shell: bash
        run: |
          expected_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json"
          expected_download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.manifest.outputs.tag }}/gt-warbands.zip"
          [[ "$(jq -r '.manifest' module.json)" == "${expected_manifest}" ]]
          [[ "$(jq -r '.download' module.json)" == "${expected_download}" ]]

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.manifest.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              dist/module.json \
              dist/gt-warbands.zip \
              --clobber
          else
            gh release create "${tag}" \
              dist/module.json \
              dist/gt-warbands.zip \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "GT-Warbands ${tag}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gt-warbands
          path: |
            dist/module.json
            dist/gt-warbands.zip
