name: Release Foundry Module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches module version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(jq -r '.version' module.json)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module version v${version}." >&2
            exit 1
          fi

      - name: Build Foundry package
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/gt-warbands
          cp module.json README.md dist/gt-warbands/
          cp -R lang scripts styles templates dist/gt-warbands/
          if [[ -f LICENSE ]]; then
            cp LICENSE dist/gt-warbands/
          fi
          cp module.json dist/module.json
          cd dist
          zip -r gt-warbands.zip gt-warbands

      - name: Validate release URLs
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(jq -r '.version' module.json)"
          expected_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json"
          expected_download="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/gt-warbands.zip"
          [[ "$(jq -r '.manifest' module.json)" == "${expected_manifest}" ]]
          [[ "$(jq -r '.download' module.json)" == "${expected_download}" ]]

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/module.json \
            dist/gt-warbands.zip \
            --verify-tag \
            --generate-notes \
            --title "GT-Warbands ${GITHUB_REF_NAME}"

      - name: Upload package for manual workflow runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gt-warbands
          path: |
            dist/module.json
            dist/gt-warbands.zip
